<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion PDF Snippet Reader</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: rgba(255,255,255,0.88);
      --border: #ece8e1;
      --text: #37352f;
      --muted: #787774;
      --accent: #2f6feb;
      --soft: #f7f6f3;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
      --radius: 18px;
      --sidebar-width: 360px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(to bottom, #ffffff, #fbfaf8);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--sidebar-width);
      height: 100vh;
      gap: 16px;
      padding: 16px;
    }

    .reader-shell,
    .sidebar {
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .reader-shell {
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.85);
    }

    .group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .spacer { flex: 1; }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    .file-label {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    button:hover,
    .file-label:hover {
      border-color: #d6d3ce;
      transform: translateY(-1px);
    }

    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    button.ghost {
      background: transparent;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 111, 235, 0.12);
    }

    #pdfUrl {
      width: min(360px, 42vw);
    }

    .file-label input {
      display: none;
    }

    .viewer-wrap {
      position: relative;
      overflow: auto;
      padding: 28px;
      background:
        radial-gradient(circle at top, rgba(47,111,235,0.035), transparent 30%),
        linear-gradient(to bottom, #fcfbf8, #f7f5f1);
      scroll-behavior: smooth;
    }

    .viewer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-bottom: 80px;
    }

    .page-shell {
      position: relative;
      width: fit-content;
      background: white;
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.09);
      overflow: hidden;
    }

    .page-meta {
      position: sticky;
      top: 12px;
      align-self: flex-end;
      z-index: 5;
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 13px;
      box-shadow: var(--shadow);
      margin-bottom: 6px;
    }

    canvas {
      display: block;
      background: white;
    }

    .textLayer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      line-height: 1;
      opacity: 1;
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }

    .textLayer > span,
    .textLayer > br {
      color: transparent;
      position: absolute;
      white-space: pre;
      transform-origin: 0% 0%;
    }

    .textLayer ::selection {
      background: rgba(255, 219, 77, 0.65);
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      overflow: hidden;
    }

    .sidebar-header,
    .sidebar-footer {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-footer {
      border-bottom: none;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .sidebar-header h1 {
      margin: 0 0 6px;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .snippet-form {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 10px;
      background: rgba(247,246,243,0.55);
    }

    .snippet-form textarea {
      min-height: 78px;
      resize: vertical;
    }

    .snippet-list {
      overflow: auto;
      padding: 16px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .snippet-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      padding: 14px;
      box-shadow: 0 4px 10px rgba(15,23,42,0.03);
      display: grid;
      gap: 10px;
    }

    .snippet-card blockquote {
      margin: 0;
      padding: 12px 14px;
      background: #faf8f4;
      border-left: 4px solid #e7d7a9;
      border-radius: 10px;
      color: var(--text);
      white-space: pre-wrap;
    }

    .snippet-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--soft);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .snippet-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty-state {
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      padding: 36px 18px;
      line-height: 1.5;
      border: 1px dashed var(--border);
      border-radius: 18px;
      background: rgba(255,255,255,0.55);
    }

    .status {
      padding: 10px 14px;
      border-radius: 12px;
      background: #f7f6f3;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    .hidden { display: none !important; }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) minmax(260px, 36vh);
      }
      #pdfUrl { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="reader-shell">
      <div class="topbar">
        <label class="file-label">
          Upload PDF
          <input type="file" id="fileInput" accept="application/pdf" />
        </label>

        <div class="group">
          <input type="text" id="pdfUrl" placeholder="Or paste a direct PDF URL" />
          <button id="loadUrlBtn">Load URL</button>
        </div>

        <div class="group">
          <button id="prevPageBtn" class="ghost">← Page</button>
          <span id="pageCounter" class="status">No PDF loaded</span>
          <button id="nextPageBtn" class="ghost">Page →</button>
        </div>

        <div class="group">
          <button id="zoomOutBtn" class="ghost">−</button>
          <span id="zoomLabel" class="status">100%</span>
          <button id="zoomInBtn" class="ghost">+</button>
          <button id="fitWidthBtn" class="ghost">Fit width</button>
        </div>

        <div class="spacer"></div>
        <div id="docStatus" class="status">Ready</div>
      </div>

      <div class="viewer-wrap" id="viewerWrap">
        <div class="viewer" id="viewer">
          <div class="empty-state" id="emptyState">
            <div>
              <strong>Upload a PDF or paste a direct PDF link.</strong><br />
              Then highlight text in the document to turn it into a saved snippet.
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Snippet Library</h1>
        <div class="muted">
          Select text in the PDF, then save it with an optional note. Snippets are stored locally in your browser for each document.
        </div>
      </div>

      <div class="snippet-form">
        <div class="status" id="selectionStatus">No text selected yet.</div>
        <textarea id="selectedQuote" placeholder="Selected text will appear here..."></textarea>
        <textarea id="noteInput" placeholder="Add your note, label, or why this matters..."></textarea>
        <div class="group">
          <button id="saveSnippetBtn" class="primary">Save snippet</button>
          <button id="clearDraftBtn">Clear draft</button>
        </div>
      </div>

      <div class="snippet-list" id="snippetList"></div>

      <div class="sidebar-footer">
        <button id="exportBtn">Export snippets JSON</button>
        <button id="copyAllBtn">Copy all as notes</button>
        <button id="clearAllBtn">Delete all</button>
      </div>
    </aside>
  </div>

  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
    import { TextLayer } from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/web/pdf_viewer.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

    const fileInput = document.getElementById('fileInput');
    const pdfUrlInput = document.getElementById('pdfUrl');
    const loadUrlBtn = document.getElementById('loadUrlBtn');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const pageCounter = document.getElementById('pageCounter');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const fitWidthBtn = document.getElementById('fitWidthBtn');
    const zoomLabel = document.getElementById('zoomLabel');
    const docStatus = document.getElementById('docStatus');
    const viewer = document.getElementById('viewer');
    const viewerWrap = document.getElementById('viewerWrap');
    const emptyState = document.getElementById('emptyState');
    const selectedQuote = document.getElementById('selectedQuote');
    const noteInput = document.getElementById('noteInput');
    const selectionStatus = document.getElementById('selectionStatus');
    const saveSnippetBtn = document.getElementById('saveSnippetBtn');
    const clearDraftBtn = document.getElementById('clearDraftBtn');
    const snippetList = document.getElementById('snippetList');
    const exportBtn = document.getElementById('exportBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const copyAllBtn = document.getElementById('copyAllBtn');

    let pdfDoc = null;
    let scale = 1.15;
    let currentPage = 1;
    let pageCanvases = new Map();
    let currentDocKey = 'default';
    let selectedPage = null;
    let renderMode = 'single';

    function setStatus(text) {
      docStatus.textContent = text;
    }

    function getStorageKey(docKey) {
      return `notion_pdf_snippets::${docKey}`;
    }

    function normalizeText(text) {
      return text.replace(/\s+/g, ' ').trim();
    }

    function saveSnippets(snippets) {
      localStorage.setItem(getStorageKey(currentDocKey), JSON.stringify(snippets));
    }

    function loadSnippets() {
      try {
        return JSON.parse(localStorage.getItem(getStorageKey(currentDocKey)) || '[]');
      } catch {
        return [];
      }
    }

    function renderSnippets() {
      const snippets = loadSnippets().sort((a, b) => b.createdAt - a.createdAt);
      snippetList.innerHTML = '';

      if (!snippets.length) {
        snippetList.innerHTML = `
          <div class="empty-state">
            <div>
              No snippets saved yet.<br />
              Highlight text in the PDF to capture your first one.
            </div>
          </div>
        `;
        return;
      }

      for (const item of snippets) {
        const card = document.createElement('div');
        card.className = 'snippet-card';
        card.innerHTML = `
          <div class="snippet-top">
            <span class="tag">Page ${item.page}</span>
            <span class="muted">${new Date(item.createdAt).toLocaleString()}</span>
          </div>
          <blockquote>${escapeHtml(item.quote)}</blockquote>
          ${item.note ? `<div>${escapeHtml(item.note)}</div>` : ''}
          <div class="snippet-actions">
            <button data-jump="${item.page}">Jump to page</button>
            <button data-copy="${item.id}">Copy</button>
            <button data-delete="${item.id}">Delete</button>
          </div>
        `;
        snippetList.appendChild(card);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function updatePageCounter() {
      if (!pdfDoc) {
        pageCounter.textContent = 'No PDF loaded';
        return;
      }
      pageCounter.textContent = `Page ${currentPage} of ${pdfDoc.numPages}`;
    }

    function updateZoomLabel() {
      zoomLabel.textContent = `${Math.round(scale * 100)}%`;
    }

    async function loadPdf(source, label = 'PDF') {
      try {
        setStatus('Loading PDF...');
        emptyState.classList.add('hidden');
        viewer.innerHTML = '';
        pageCanvases.clear();
        currentPage = 1;
        selectedPage = null;
        selectedQuote.value = '';
        noteInput.value = '';
        selectionStatus.textContent = 'No text selected yet.';

        const loadingTask = pdfjsLib.getDocument(source);
        pdfDoc = await loadingTask.promise;
        currentDocKey = makeDocKey(pdfDoc, label);
        renderSnippets();
        updatePageCounter();
        updateZoomLabel();
        await renderCurrentPage();
        setStatus(`Loaded: ${label}`);
      } catch (error) {
        console.error(error);
        viewer.innerHTML = '';
        emptyState.classList.remove('hidden');
        viewer.appendChild(emptyState);
        setStatus('Could not load PDF');
        pageCounter.textContent = 'No PDF loaded';
      }
    }

    function makeDocKey(pdf, label) {
      const fp = pdf?.fingerprints?.[0] || 'unknown';
      return `${label}::${fp}`;
    }

    async function renderCurrentPage() {
      if (!pdfDoc) return;
      viewer.innerHTML = '';
      await renderPage(currentPage, true);
      updatePageCounter();
      updateZoomLabel();
    }

    async function renderPage(pageNumber, scrollIntoView = false) {
      const page = await pdfDoc.getPage(pageNumber);
      const viewport = page.getViewport({ scale });

      const shell = document.createElement('div');
      shell.className = 'page-shell';
      shell.dataset.pageNumber = String(pageNumber);

      const meta = document.createElement('div');
      meta.className = 'page-meta';
      meta.textContent = `Page ${pageNumber}`;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      canvas.width = Math.floor(viewport.width * window.devicePixelRatio);
      canvas.height = Math.floor(viewport.height * window.devicePixelRatio);
      canvas.style.width = `${viewport.width}px`;
      canvas.style.height = `${viewport.height}px`;

      const outputScale = window.devicePixelRatio || 1;
      ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);

      const textLayerDiv = document.createElement('div');
      textLayerDiv.className = 'textLayer';
      textLayerDiv.style.width = `${viewport.width}px`;
      textLayerDiv.style.height = `${viewport.height}px`;
      textLayerDiv.dataset.pageNumber = String(pageNumber);

      const wrapper = document.createElement('div');
      wrapper.style.position = 'relative';
      wrapper.style.width = `${viewport.width}px`;
      wrapper.style.height = `${viewport.height}px`;

      wrapper.appendChild(canvas);
      wrapper.appendChild(textLayerDiv);
      shell.appendChild(wrapper);
      viewer.appendChild(meta);
      viewer.appendChild(shell);

      await page.render({
        canvasContext: ctx,
        viewport,
      }).promise;

      const textContent = await page.getTextContent();
      const textLayer = new TextLayer({
        textContentSource: textContent,
        container: textLayerDiv,
        viewport,
      });
      await textLayer.render();

      pageCanvases.set(pageNumber, { shell, textLayerDiv });

      if (scrollIntoView) {
        shell.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
    }

    function captureSelection() {
      const selection = window.getSelection();
      const text = normalizeText(selection?.toString() || '');
      if (!text) return;

      const range = selection.getRangeAt(0);
      const startEl = range.startContainer?.parentElement?.closest('.textLayer');
      const endEl = range.endContainer?.parentElement?.closest('.textLayer');
      const layerEl = startEl || endEl;
      const page = layerEl?.dataset?.pageNumber ? Number(layerEl.dataset.pageNumber) : currentPage;

      selectedPage = page;
      selectedQuote.value = text;
      selectionStatus.textContent = `Selected text from page ${page}`;
    }

    function saveSnippet() {
      const quote = normalizeText(selectedQuote.value);
      const note = noteInput.value.trim();

      if (!quote) {
        selectionStatus.textContent = 'Select text from the PDF first.';
        return;
      }

      const snippets = loadSnippets();
      snippets.push({
        id: crypto.randomUUID(),
        page: selectedPage || currentPage,
        quote,
        note,
        createdAt: Date.now(),
      });
      saveSnippets(snippets);
      renderSnippets();
      noteInput.value = '';
      selectionStatus.textContent = 'Snippet saved.';
    }

    function deleteSnippet(id) {
      const snippets = loadSnippets().filter(item => item.id !== id);
      saveSnippets(snippets);
      renderSnippets();
    }

    async function jumpToPage(page) {
      if (!pdfDoc) return;
      currentPage = Math.max(1, Math.min(pdfDoc.numPages, Number(page)));
      await renderCurrentPage();
    }

    function exportSnippets() {
      const data = loadSnippets();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'pdf-snippets.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    async function copyAllNotes() {
      const snippets = loadSnippets().sort((a, b) => a.page - b.page || a.createdAt - b.createdAt);
      if (!snippets.length) return;
      const text = snippets.map(item => {
        return `Page ${item.page}\nQuote: ${item.quote}${item.note ? `\nNote: ${item.note}` : ''}`;
      }).join('\n\n---\n\n');
      await navigator.clipboard.writeText(text);
      setStatus('Copied snippets to clipboard');
    }

    function clearAllSnippets() {
      localStorage.removeItem(getStorageKey(currentDocKey));
      renderSnippets();
    }

    function fitWidth() {
      const available = viewerWrap.clientWidth - 80;
      const firstShell = viewer.querySelector('.page-shell canvas');
      if (!firstShell || !pdfDoc) return;
      const displayedWidth = parseFloat(firstShell.style.width || '0');
      if (!displayedWidth) return;
      scale = Math.max(0.4, scale * (available / displayedWidth));
      renderCurrentPage();
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const arrayBuffer = await file.arrayBuffer();
      await loadPdf({ data: arrayBuffer }, file.name);
    });

    loadUrlBtn.addEventListener('click', async () => {
      const url = pdfUrlInput.value.trim();
      if (!url) return;
      await loadPdf(url, url.split('/').pop() || 'Remote PDF');
    });

    prevPageBtn.addEventListener('click', async () => {
      if (!pdfDoc) return;
      currentPage = Math.max(1, currentPage - 1);
      await renderCurrentPage();
    });

    nextPageBtn.addEventListener('click', async () => {
      if (!pdfDoc) return;
      currentPage = Math.min(pdfDoc.numPages, currentPage + 1);
      await renderCurrentPage();
    });

    zoomInBtn.addEventListener('click', async () => {
      if (!pdfDoc) return;
      scale = Math.min(3, +(scale + 0.1).toFixed(2));
      await renderCurrentPage();
    });

    zoomOutBtn.addEventListener('click', async () => {
      if (!pdfDoc) return;
      scale = Math.max(0.5, +(scale - 0.1).toFixed(2));
      await renderCurrentPage();
    });

    fitWidthBtn.addEventListener('click', fitWidth);
    saveSnippetBtn.addEventListener('click', saveSnippet);

    clearDraftBtn.addEventListener('click', () => {
      selectedQuote.value = '';
      noteInput.value = '';
      selectionStatus.textContent = 'Draft cleared.';
    });

    exportBtn.addEventListener('click', exportSnippets);
    clearAllBtn.addEventListener('click', clearAllSnippets);
    copyAllBtn.addEventListener('click', copyAllNotes);

    snippetList.addEventListener('click', async (e) => {
      const jumpBtn = e.target.closest('[data-jump]');
      const copyBtn = e.target.closest('[data-copy]');
      const deleteBtn = e.target.closest('[data-delete]');
      const snippets = loadSnippets();

      if (jumpBtn) {
        await jumpToPage(Number(jumpBtn.dataset.jump));
      }

      if (copyBtn) {
        const item = snippets.find(x => x.id === copyBtn.dataset.copy);
        if (!item) return;
        const text = `Page ${item.page}\nQuote: ${item.quote}${item.note ? `\nNote: ${item.note}` : ''}`;
        await navigator.clipboard.writeText(text);
        setStatus('Snippet copied');
      }

      if (deleteBtn) {
        deleteSnippet(deleteBtn.dataset.delete);
      }
    });

    document.addEventListener('mouseup', () => {
      queueMicrotask(captureSelection);
    });

    window.addEventListener('resize', () => {
      updateZoomLabel();
    });

    // Optional: auto-load ?pdf=... for a cleaner hosted Notion embed.
    const params = new URLSearchParams(window.location.search);
    const initialPdf = params.get('pdf');
    if (initialPdf) {
      pdfUrlInput.value = initialPdf;
      loadPdf(initialPdf, initialPdf.split('/').pop() || 'Remote PDF');
    }
  </script>
</body>
</html
