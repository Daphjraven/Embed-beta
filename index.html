<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive PDF Study Page</title>
  <style>
    :root {
      --paper: #ffffff;
      --text: #2f3437;
      --muted: #787774;
      --accent: #2383e2;
      --accent-soft: rgba(35, 131, 226, 0.1);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 0;
      background: transparent;
    }

    .app {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 16px;
      align-items: start;
      background: transparent;
    }

    .paper-shell,
    .sidebar {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
    }

    .paper-toolbar,
    .toolbar-actions,
    .footer-note,
    .meta button,
    #showAnswerBtn,
    #toggleHotspotsBtn,
    #resetBtn,
    #checkBtn,
    #clearBtn,
    .hotspot {
      display: none !important;
    }

    .paper-wrap {
      padding: 0;
      background: transparent;
    }

    .paper-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 0.78;
      background: white;
      border-radius: 0;
      overflow: hidden;
      margin-inline: auto;
    }

    .paper-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: white;
      user-select: none;
      pointer-events: none;
    }

    .sidebar {
      padding: 4px 0 0;
      position: sticky;
      top: 12px;
      min-width: 0;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .sidebar h2 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 700;
    }

    .sidebar p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .question-card {
      border: none;
      border-radius: 0;
      padding: 0;
      background: transparent;
      margin-top: 18px;
    }

    .question-card h3 {
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 700;
    }

    .question-card label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--muted);
    }

    textarea, input[type="text"] {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 0;
      font: inherit;
      color: inherit;
      outline: none;
      resize: none;
      background: transparent;
      min-height: 140px;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .pill {
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
    }

    .answer-box {
      margin-top: 18px;
      padding-top: 0;
      display: block;
      border-top: none;
    }

    .answer-box.show { display: block; }

    .empty-state {
      display: none;
    }

    @media (max-width: 900px) {
      .app {
        width: min(700px, 100%);
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .sidebar {
        position: static;
      }
      .sidebar h2 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="paper-shell">
      <div class="paper-wrap">
        <div class="paper-stage" id="paperStage">
          <img
            class="paper-image"
            src="https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=1200&q=80"
            alt="PDF page"
            id="pageImage"
          />
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="eyebrow">Study panel</div>
      <h2 id="panelTitle">Select a highlighted region</h2>
      <p id="panelDescription">Click a hotspot on the page to open a question tied to that exact part of the PDF page.</p>

      

      <div class="question-card" id="questionCard" hidden>
        <div class="meta" id="meta"></div>
        <h3 id="questionTitle"></h3>
        <p id="questionPrompt"></p>
        <label for="responseBox">Your response</label>
        <textarea id="responseBox" rows="6" placeholder="Type your answer, summary, derivation, or annotation here..."></textarea>
        
        <div class="answer-box" id="answerBox">
          <label>Suggested answer</label>
          <div id="answerText"></div>
        </div>
      </div>

      
    </aside>
  </main>

  <script>
    const hotspots = [
      {
        id: 1,
        title: 'Chapter title',
        prompt: 'What is the central topic introduced by this chapter title, and why is it important in quantum chemistry?',
        answer: 'This chapter introduces the Schrödinger equation and the particle-in-a-box model. The Schrödinger equation is the fundamental equation of quantum mechanics because it is used to determine wave functions and the allowed energies of quantum systems.',
        tags: ['overview', 'concept']
      }
    ];

    const questionCard = document.getElementById('questionCard');
    const panelTitle = document.getElementById('panelTitle');
    const panelDescription = document.getElementById('panelDescription');
    const questionTitle = document.getElementById('questionTitle');
    const questionPrompt = document.getElementById('questionPrompt');
    const answerText = document.getElementById('answerText');
    const answerBox = document.getElementById('answerBox');
    const meta = document.getElementById('meta');
    const responseBox = document.getElementById('responseBox');

    function loadDefaultCard() {
      const item = hotspots[0];
      panelTitle.textContent = item.title;
      panelDescription.textContent = 'Question linked to the selected region of the page.';
      questionTitle.textContent = item.title;
      questionPrompt.textContent = item.prompt;
      answerText.textContent = item.answer;
      meta.innerHTML = item.tags.map(tag => `<span class="pill">${tag}</span>`).join('');
      questionCard.hidden = false;
      answerBox.classList.add('show');
      responseBox.value = '';
    }

    loadDefaultCard();
  </script>
</body>
</html>
