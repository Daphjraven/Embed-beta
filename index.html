<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blank PDF Canvas</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #ffffff;
      overflow: auto;
      font-family: Inter, Arial, sans-serif;
    }

    #viewer {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      background: #ffffff;
      padding-top: 0;
      width: 100%;
    }

    .page {
      position: relative;
      line-height: 0;
    }

    canvas {
      display: block;
      background: #ffffff;
      margin: 0;
      padding: 0;
    }

    iframe.drive-frame {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
      background: #ffffff;
    }

    .floating-btn {
      position: fixed;
      left: 12px;
      z-index: 1000;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      color: #444;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      backdrop-filter: blur(8px);
    }

    #toggleLoader { top: 12px; }
    #toggleNotepad { top: 54px; font-size: 15px; }

    #loaderPanel,
    #notepadPanel {
      position: fixed;
      left: 56px;
      z-index: 999;
      width: min(420px, calc(100vw - 76px));
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
      transition: opacity 0.18s ease, transform 0.18s ease;
      backdrop-filter: blur(8px);
    }

    #loaderPanel { top: 12px; }
    #notepadPanel {
      top: 54px;
      width: min(360px, calc(100vw - 76px));
    }

    #loaderPanel.hidden,
    #notepadPanel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
    }

    .loader-title,
    .notepad-title {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .loader-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #pdfInput {
      flex: 1;
      min-width: 0;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
      font-size: 14px;
      background: #fff;
    }

    #loadBtn,
    #clearNotesBtn {
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }

    #hint,
    #noteHint {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
      line-height: 1.35;
    }

    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 1000;
      max-width: min(520px, calc(100vw - 24px));
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      color: #555;
      font-size: 13px;
      line-height: 1.35;
    }

    #status.hidden {
      display: none;
    }

    #notepad {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      font-size: 14px;
      line-height: 1.5;
      background: #fff;
      color: #333;
      font-family: Inter, Arial, sans-serif;
    }

    .notepad-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <button id="toggleLoader" class="floating-btn" title="Show or hide PDF loader">+</button>
  <button id="toggleNotepad" class="floating-btn" title="Show or hide notepad">✎</button>

  <div id="loaderPanel" class="hidden">
    <div class="loader-title">Paste a direct PDF URL or a Google Drive share link</div>
    <div class="loader-row">
      <input id="pdfInput" type="text" placeholder="Paste Google Drive PDF link here" />
      <button id="loadBtn">Load PDF</button>
    </div>
    <div id="hint">Google Drive links will open in a lightweight Drive preview. Direct PDF links will render on the blank canvas.</div>
  </div>

  <div id="notepadPanel" class="hidden">
    <div class="notepad-title">Quick notepad</div>
    <textarea id="notepad" placeholder="Write notes here..."></textarea>
    <div class="notepad-actions">
      <button id="clearNotesBtn">Clear</button>
    </div>
    <div id="noteHint">Your notes stay saved in this browser.</div>
  </div>

  <div id="viewer"></div>
  <div id="status" class="hidden"></div>

  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

    const viewer = document.getElementById('viewer');
    const toggleLoader = document.getElementById('toggleLoader');
    const toggleNotepad = document.getElementById('toggleNotepad');
    const loaderPanel = document.getElementById('loaderPanel');
    const notepadPanel = document.getElementById('notepadPanel');
    const pdfInput = document.getElementById('pdfInput');
    const loadBtn = document.getElementById('loadBtn');
    const statusBox = document.getElementById('status');
    const notepad = document.getElementById('notepad');
    const clearNotesBtn = document.getElementById('clearNotesBtn');

    const NOTE_KEY = 'embed_beta_notepad';

    function showStatus(message) {
      statusBox.textContent = message;
      statusBox.classList.remove('hidden');
    }

    function hideStatus() {
      statusBox.classList.add('hidden');
      statusBox.textContent = '';
    }

    function getQueryPdf() {
      const params = new URLSearchParams(window.location.search);
      return params.get('pdf');
    }

    function extractDriveFileId(url) {
      if (!url) return null;
      const patterns = [
        /\/file\/d\/([a-zA-Z0-9_-]+)/,
        /[?&]id=([a-zA-Z0-9_-]+)/,
        /\/d\/([a-zA-Z0-9_-]+)/
      ];
      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    function isDriveLikeUrl(url) {
      return /drive\.google\.com/i.test(url || '');
    }

    function getDrivePreviewUrl(input) {
      const fileId = extractDriveFileId(input);
      if (!fileId) return null;
      return `https://drive.google.com/file/d/${fileId}/preview`;
    }

    function normalizeStoredUrl(input) {
      const raw = (input || '').trim();
      if (!raw) return '';
      return raw;
    }

    function loadSavedNotes() {
      try {
        return localStorage.getItem(NOTE_KEY) || '';
      } catch {
        return '';
      }
    }

    function saveNotes(value) {
      try {
        localStorage.setItem(NOTE_KEY, value);
      } catch {}
    }

    async function renderDrivePreview(url) {
      viewer.innerHTML = '';
      const previewUrl = getDrivePreviewUrl(url);
      if (!previewUrl) {
        showStatus('Could not detect a Google Drive file ID from that link.');
        return;
      }
      const frame = document.createElement('iframe');
      frame.className = 'drive-frame';
      frame.src = previewUrl;
      frame.allow = 'autoplay';
      viewer.appendChild(frame);
      hideStatus();
    }

    async function renderPdfCanvas(url) {
      viewer.innerHTML = '';
      try {
        const pdf = await pdfjsLib.getDocument(url).promise;

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.35 });

          const pageWrap = document.createElement('div');
          pageWrap.className = 'page';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          const ratio = window.devicePixelRatio || 1;

          canvas.width = Math.floor(viewport.width * ratio);
          canvas.height = Math.floor(viewport.height * ratio);
          canvas.style.width = `${viewport.width}px`;
          canvas.style.height = `${viewport.height}px`;

          context.setTransform(ratio, 0, 0, ratio, 0, 0);

          pageWrap.appendChild(canvas);
          viewer.appendChild(pageWrap);

          await page.render({
            canvasContext: context,
            viewport
          }).promise;
        }
        hideStatus();
      } catch (error) {
        console.error(error);
        viewer.innerHTML = '';
        showStatus('This PDF could not be rendered on the blank canvas. If it is from Google Drive, try the original share link instead of a uc/export link.');
      }
    }

    async function renderSource(url) {
      const raw = normalizeStoredUrl(url);
      if (!raw) return;
      if (isDriveLikeUrl(raw)) {
        await renderDrivePreview(raw);
      } else {
        await renderPdfCanvas(raw);
      }
    }

    function loadFromInput() {
      const url = normalizeStoredUrl(pdfInput.value);
      if (!url) return;
      const next = new URL(window.location.href);
      next.searchParams.set('pdf', url);
      window.history.replaceState({}, '', next.toString());
      renderSource(url);
      loaderPanel.classList.add('hidden');
      toggleLoader.textContent = '+';
    }

    toggleLoader.addEventListener('click', () => {
      const hidden = loaderPanel.classList.toggle('hidden');
      toggleLoader.textContent = hidden ? '+' : '×';
    });

    toggleNotepad.addEventListener('click', () => {
      const hidden = notepadPanel.classList.toggle('hidden');
      toggleNotepad.textContent = hidden ? '✎' : '×';
    });

    loadBtn.addEventListener('click', loadFromInput);
    pdfInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadFromInput();
    });

    notepad.value = loadSavedNotes();
    notepad.addEventListener('input', () => {
      saveNotes(notepad.value);
    });

    clearNotesBtn.addEventListener('click', () => {
      notepad.value = '';
      saveNotes('');
    });

    const initialPdf = getQueryPdf();
    if (initialPdf) {
      pdfInput.value = initialPdf;
      renderSource(initialPdf);
    }
  </script>
  <button id="embedBtn" class="floating-btn" style="top:96px; font-size:14px;">⧉</button>

  <div id="embedPanel" class="hidden" style="top:96px;">
    <div class="notepad-title">Notion Embed Code</div>
    <textarea id="embedCode" readonly style="width:100%; min-height:120px; border:1px solid rgba(0,0,0,0.1); border-radius:12px; padding:10px;"></textarea>
    <div class="notepad-actions">
      <button id="copyEmbedBtn">Copy</button>
    </div>
    <div id="noteHint">Paste this into a Notion embed block.</div>
  </div>

  <script>
    const embedBtn = document.getElementById('embedBtn');
    const embedPanel = document.getElementById('embedPanel');
    const embedCode = document.getElementById('embedCode');
    const copyEmbedBtn = document.getElementById('copyEmbedBtn');

    function generateEmbedCode() {
      const url = window.location.href;
      return url;
    }" style="width:100%; height:600px; border:none;"></iframe>`;
    }

    embedBtn.addEventListener('click', () => {
      const hidden = embedPanel.classList.toggle('hidden');
      embedBtn.textContent = hidden ? '⧉' : '×';
      if (!hidden) {
        embedCode.value = generateEmbedCode();
      }
    });

    copyEmbedBtn.addEventListener('click', async () => {
      await navigator.clipboard.writeText(embedCode.value);
    });
  </script>
</body>
</html>
