<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Canvas Reader</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #ffffff;
      overflow: auto;
      font-family: Inter, Arial, sans-serif;
      color: #333;
    }

    #viewer {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
      width: 100%;
      padding: 0;
      margin: 0;
    }

    .page {
      position: relative;
      line-height: 0;
      background: #ffffff;
      margin: 0;
    }

    canvas {
      display: block;
      background: #ffffff;
      margin: 0 auto;
      padding: 0;
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: auto;
    }

    .overlay.hotspot-mode {
      cursor: crosshair;
    }

    .hotspot {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.96);
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #444;
      cursor: pointer;
      user-select: none;
    }

    .hotspot-note {
      position: absolute;
      min-width: 260px;
      width: 320px;
      min-height: 220px;
      border-radius: 16px;
      background: rgba(255,255,255,0.99);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 14px 36px rgba(0,0,0,0.16);
      font-size: 13px;
      line-height: 1.45;
      color: #444;
      top: 22px;
      left: 22px;
      display: none;
      z-index: 20;
      overflow: hidden;
    }

    .hotspot-note.visible {
      display: block;
    }

    .hotspot-window-bar {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px 0 12px;
      background: rgba(248,248,248,0.98);
      border-bottom: 1px solid rgba(0,0,0,0.07);
      cursor: move;
      user-select: none;
    }

    .hotspot-window-title {
      font-size: 12px;
      color: #666;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .hotspot-window-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hotspot-tool-btn {
      border: 1px solid rgba(0,0,0,0.08);
      background: #fff;
      border-radius: 10px;
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      font-size: 12px;
      color: #444;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .hotspot-workspace {
      position: relative;
      width: 100%;
      height: 240px;
      background: #fff;
      overflow: auto;
    }

    .hotspot-freeform {
      position: relative;
      width: 100%;
      min-height: 100%;
      background:
        linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .hotspot-item {
      position: absolute;
      min-width: 100px;
      min-height: 36px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .hotspot-item.selected {
      outline: 2px solid rgba(17,17,17,0.18);
      outline-offset: 1px;
    }

    .hotspot-item-handle {
      height: 26px;
      background: rgba(247,247,247,0.98);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      cursor: move;
    }

    .hotspot-text-content {
      padding: 10px 12px;
      min-height: 52px;
      font-size: 13px;
      line-height: 1.45;
      color: #333;
      outline: none;
      white-space: pre-wrap;
    }

    .hotspot-image-content {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #fff;
    }

    .hotspot-resize {
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: rgba(0,0,0,0.14);
      cursor: nwse-resize;
    }

    .controls {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .floating-btn {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 999px;
      background: rgba(255,255,255,0.94);
      color: #444;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      backdrop-filter: blur(8px);
    }

    .floating-btn.active {
      background: #111;
      color: #fff;
    }

    #notepadPanel,
    #embedPanel {
      position: fixed;
      left: 56px;
      z-index: 999;
      width: min(360px, calc(100vw - 76px));
      background: rgba(255,255,255,0.97);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
      transition: opacity 0.18s ease, transform 0.18s ease;
      backdrop-filter: blur(8px);
    }

    #notepadPanel { top: 52px; }
    #embedPanel { top: 92px; }

    #notepadPanel.hidden,
    #embedPanel.hidden,
    #status.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      display: none;
    }

    .panel-title {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    #notepad,
    #embedCode {
      width: 100%;
      border: 1px solid rgba(0,0,0,0.10);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      font-size: 14px;
      line-height: 1.5;
      background: #fff;
      color: #333;
      font-family: Inter, Arial, sans-serif;
    }

    #notepad {
      min-height: 220px;
      resize: vertical;
    }

    #embedCode {
      min-height: 110px;
      resize: none;
    }

    .panel-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .panel-btn {
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }

    .panel-hint {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
      line-height: 1.35;
    }

    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 1000;
      max-width: min(520px, calc(100vw - 24px));
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.97);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      color: #555;
      font-size: 13px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="toggleUrlPanel" class="floating-btn" title="Load PDF from URL">＋</button>
    <button id="uploadBtn" class="floating-btn" title="Upload PDF">📄</button>
    <button id="toggleNotepad" class="floating-btn" title="Show or hide notepad">✎</button>
    <button id="toggleHotspots" class="floating-btn" title="Add clickable hotspots">◎</button>
    <button id="saveSessionBtn" class="floating-btn" title="Save session and copy shareable URL">💾</button>
    <button id="embedBtn" class="floating-btn" title="Copy current URL for Notion embed">⧉</button>
  </div>

  <input id="fileInput" type="file" accept="application/pdf" style="display:none;" />

  <div id="urlPanel" class="hidden" style="position:fixed; left:56px; top:12px; z-index:999; width:min(420px, calc(100vw - 76px)); background:rgba(255,255,255,0.97); border:1px solid rgba(0,0,0,0.08); border-radius:16px; padding:12px; box-shadow:0 10px 30px rgba(0,0,0,0.10); backdrop-filter:blur(8px);">
    <div class="panel-title">PDF URL</div>
    <input id="pdfUrlInput" type="text" placeholder="Paste a direct PDF URL here" style="width:100%; border:1px solid rgba(0,0,0,0.10); border-radius:12px; padding:10px 12px; font-size:14px;" />
    <div class="panel-actions">
      <button id="loadUrlBtn" class="panel-btn">Load URL</button>
    </div>
    <div class="panel-hint">This is best for a persistent Notion-embeddable PDF source.</div>
  </div>

  <div id="notepadPanel" class="hidden">
    <div class="panel-title">Quick notepad</div>
    <textarea id="notepad" placeholder="Write notes here..."></textarea>
    <div class="panel-actions">
      <button id="clearNotesBtn" class="panel-btn">Clear</button>
    </div>
    <div class="panel-hint">Your notes stay saved in this browser.</div>
  </div>

  <div id="embedPanel" class="hidden">
    <div class="panel-title">Notion Embed URL</div>
    <textarea id="embedCode" readonly></textarea>
    <div class="panel-actions">
      <button id="copyEmbedBtn" class="panel-btn">Copy</button>
    </div>
    <div class="panel-hint">Paste this URL into a Notion embed block. Local file uploads stay local to this browser.</div>
  </div>

  <div id="viewer"></div>
  <div id="status" class="hidden"></div>

  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

    const viewer = document.getElementById('viewer');
    const fileInput = document.getElementById('fileInput');
    const toggleUrlPanel = document.getElementById('toggleUrlPanel');
    const pdfUrlInput = document.getElementById('pdfUrlInput');
    const loadUrlBtn = document.getElementById('loadUrlBtn');
    const urlPanel = document.getElementById('urlPanel');
    const uploadBtn = document.getElementById('uploadBtn');
    const toggleNotepad = document.getElementById('toggleNotepad');
    const toggleHotspots = document.getElementById('toggleHotspots');
    const saveSessionBtn = document.getElementById('saveSessionBtn');
    const embedBtn = document.getElementById('embedBtn');
    const notepadPanel = document.getElementById('notepadPanel');
    const embedPanel = document.getElementById('embedPanel');
    const notepad = document.getElementById('notepad');
    const clearNotesBtn = document.getElementById('clearNotesBtn');
    const embedCode = document.getElementById('embedCode');
    const copyEmbedBtn = document.getElementById('copyEmbedBtn');
    const statusBox = document.getElementById('status');

    const NOTE_KEY = 'embed_beta_notepad';
    const HOTSPOT_KEY = 'embed_beta_hotspots';
    let hotspotMode = false;
    let currentDocKey = 'default';
    let hotspotCounter = 0;

    function showStatus(message) {
      statusBox.textContent = message;
      statusBox.classList.remove('hidden');
    }

    function hideStatus() {
      statusBox.classList.add('hidden');
      statusBox.textContent = '';
    }

    function loadSavedNotes() {
      try {
        return localStorage.getItem(NOTE_KEY) || '';
      } catch {
        return '';
      }
    }

    function saveNotes(value) {
      try {
        localStorage.setItem(NOTE_KEY, value);
      } catch {}
    }

    function getHotspotsStore() {
      try {
        return JSON.parse(localStorage.getItem(HOTSPOT_KEY) || '{}');
      } catch {
        return {};
      }
    }

    function saveHotspotsStore(store) {
      try {
        localStorage.setItem(HOTSPOT_KEY, JSON.stringify(store));
      } catch {}
    }

    function getCurrentHotspots() {
      const store = getHotspotsStore();
      return store[currentDocKey] || [];
    }

    function setCurrentHotspots(hotspots) {
      const store = getHotspotsStore();
      store[currentDocKey] = hotspots;
      saveHotspotsStore(store);
    }

    function makeDocKey(label, bytes) {
      return `${label}::${bytes}`;
    }

    function togglePanel(panel, button, openIcon) {
      const hidden = panel.classList.toggle('hidden');
      button.textContent = hidden ? openIcon : '×';
    }

    function generateEmbedUrl() {
      return window.location.href;
    }

    function getQueryPdfUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('pdf') || '';
    }

    function setQueryPdfUrl(url) {
      const next = new URL(window.location.href);
      if (url) next.searchParams.set('pdf', url);
      else next.searchParams.delete('pdf');
      window.history.replaceState({}, '', next.toString());
    }

    function getSessionData() {
      return {
        hotspots: getHotspotsStore(),
        notes: localStorage.getItem(NOTE_KEY) || ''
      };
    }

    function generateSessionURL() {
      const data = getSessionData();
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
      const url = new URL(window.location.href);
      url.searchParams.set('session', encoded);
      return url.toString();
    }

    function loadSessionFromURL() {
      const params = new URLSearchParams(window.location.search);
      const session = params.get('session');
      if (!session) return;

      try {
        const decoded = JSON.parse(decodeURIComponent(escape(atob(session))));
        if (decoded.notes) localStorage.setItem(NOTE_KEY, decoded.notes);
        if (decoded.hotspots) localStorage.setItem(HOTSPOT_KEY, JSON.stringify(decoded.hotspots));
      } catch (e) {
        console.error('Failed to load session', e);
      }
    }

    function createHotspotElement(item, overlay) {
      const dot = document.createElement('div');
      dot.className = 'hotspot';
      dot.style.left = `${item.x}%`;
      dot.style.top = `${item.y}%`;
      dot.textContent = item.label;

      const note = document.createElement('div');
      note.className = 'hotspot-note';
      note.style.left = `${item.windowLeft || 22}px`;
      note.style.top = `${item.windowTop || 22}px`;

      const bar = document.createElement('div');
      bar.className = 'hotspot-window-bar';

      const title = document.createElement('div');
      title.className = 'hotspot-window-title';
      title.textContent = `Hotspot ${item.label}`;

      const actions = document.createElement('div');
      actions.className = 'hotspot-window-actions';

      const addTextBtn = document.createElement('button');
      addTextBtn.className = 'hotspot-tool-btn';
      addTextBtn.textContent = 'T';
      addTextBtn.title = 'Add text box';

      const addImageBtn = document.createElement('button');
      addImageBtn.className = 'hotspot-tool-btn';
      addImageBtn.textContent = '🖼';
      addImageBtn.title = 'Add image';

      const closeBtn = document.createElement('button');
      closeBtn.className = 'hotspot-tool-btn';
      closeBtn.textContent = '×';
      closeBtn.title = 'Close';

      actions.appendChild(addTextBtn);
      actions.appendChild(addImageBtn);
      actions.appendChild(closeBtn);
      bar.appendChild(title);
      bar.appendChild(actions);

      const workspace = document.createElement('div');
      workspace.className = 'hotspot-workspace';
      const freeform = document.createElement('div');
      freeform.className = 'hotspot-freeform';
      workspace.appendChild(freeform);
      note.appendChild(bar);
      note.appendChild(workspace);
      dot.appendChild(note);

      const hiddenImageInput = document.createElement('input');
      hiddenImageInput.type = 'file';
      hiddenImageInput.accept = 'image/*';
      hiddenImageInput.style.display = 'none';
      note.appendChild(hiddenImageInput);

      function updateHotspotRecord() {
        const all = getCurrentHotspots().map(h => h.id === item.id ? item : h);
        setCurrentHotspots(all);
      }

      function createTextItem(data = null) {
        const entry = data || {
          id: crypto.randomUUID(),
          type: 'text',
          x: 16,
          y: 16,
          w: 180,
          h: 90,
          text: 'Double-click to edit text'
        };
        const box = document.createElement('div');
        box.className = 'hotspot-item';
        box.style.left = `${entry.x}px`;
        box.style.top = `${entry.y}px`;
        box.style.width = `${entry.w}px`;
        box.style.height = `${entry.h}px`;
        box.dataset.itemId = entry.id;

        const handle = document.createElement('div');
        handle.className = 'hotspot-item-handle';
        const content = document.createElement('div');
        content.className = 'hotspot-text-content';
        content.contentEditable = 'true';
        content.textContent = entry.text || '';

        const resize = document.createElement('div');
        resize.className = 'hotspot-resize';

        content.addEventListener('input', () => {
          entry.text = content.textContent || '';
          syncEntry(entry);
        });

        attachItemInteractions(box, handle, resize, entry);

        box.appendChild(handle);
        box.appendChild(content);
        box.appendChild(resize);
        freeform.appendChild(box);
        return entry;
      }

      function createImageItem(data) {
        const entry = {
          id: data.id || crypto.randomUUID(),
          type: 'image',
          x: data.x ?? 22,
          y: data.y ?? 22,
          w: data.w ?? 180,
          h: data.h ?? 140,
          src: data.src
        };
        const box = document.createElement('div');
        box.className = 'hotspot-item';
        box.style.left = `${entry.x}px`;
        box.style.top = `${entry.y}px`;
        box.style.width = `${entry.w}px`;
        box.style.height = `${entry.h}px`;
        box.dataset.itemId = entry.id;

        const handle = document.createElement('div');
        handle.className = 'hotspot-item-handle';
        const img = document.createElement('img');
        img.className = 'hotspot-image-content';
        img.src = entry.src;
        img.alt = 'Hotspot image';
        img.style.width = '100%';
        img.style.height = `calc(100% - 26px)`;

        const resize = document.createElement('div');
        resize.className = 'hotspot-resize';

        attachItemInteractions(box, handle, resize, entry);

        box.appendChild(handle);
        box.appendChild(img);
        box.appendChild(resize);
        freeform.appendChild(box);
        return entry;
      }

      function syncEntry(entry) {
        item.blocks = item.blocks || [];
        const idx = item.blocks.findIndex(b => b.id === entry.id);
        if (idx >= 0) item.blocks[idx] = entry;
        else item.blocks.push(entry);
        updateHotspotRecord();
      }

      function attachItemInteractions(box, handle, resize, entry) {
        box.addEventListener('mousedown', () => {
          freeform.querySelectorAll('.hotspot-item').forEach(el => el.classList.remove('selected'));
          box.classList.add('selected');
        });

        handle.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          const startX = e.clientX;
          const startY = e.clientY;
          const startLeft = parseFloat(box.style.left);
          const startTop = parseFloat(box.style.top);

          function onMove(ev) {
            const nextLeft = Math.max(0, startLeft + (ev.clientX - startX));
            const nextTop = Math.max(0, startTop + (ev.clientY - startY));
            box.style.left = `${nextLeft}px`;
            box.style.top = `${nextTop}px`;
            entry.x = nextLeft;
            entry.y = nextTop;
            syncEntry(entry);
          }

          function onUp() {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
          }

          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
        });

        resize.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          const startX = e.clientX;
          const startY = e.clientY;
          const startW = parseFloat(box.style.width);
          const startH = parseFloat(box.style.height);

          function onMove(ev) {
            const nextW = Math.max(110, startW + (ev.clientX - startX));
            const nextH = Math.max(60, startH + (ev.clientY - startY));
            box.style.width = `${nextW}px`;
            box.style.height = `${nextH}px`;
            entry.w = nextW;
            entry.h = nextH;
            syncEntry(entry);
          }

          function onUp() {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
          }

          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
        });

        box.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (!confirm('Delete this block?')) return;
          item.blocks = (item.blocks || []).filter(b => b.id !== entry.id);
          updateHotspotRecord();
          box.remove();
        });
      }

      function renderBlocks() {
        freeform.innerHTML = '';
        const blocks = item.blocks || [];
        if (!blocks.length) {
          const first = createTextItem();
          syncEntry(first);
          return;
        }
        blocks.forEach(block => {
          if (block.type === 'image') createImageItem(block);
          else createTextItem(block);
        });
      }

      addTextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const entry = createTextItem({
          id: crypto.randomUUID(),
          type: 'text',
          x: 18 + (item.blocks?.length || 0) * 10,
          y: 18 + (item.blocks?.length || 0) * 10,
          w: 180,
          h: 90,
          text: 'New text'
        });
        syncEntry(entry);
      });

      addImageBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        hiddenImageInput.click();
      });

      hiddenImageInput.addEventListener('change', async () => {
        const file = hiddenImageInput.files && hiddenImageInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const entry = createImageItem({
            src: reader.result,
            x: 22,
            y: 22,
            w: 180,
            h: 140
          });
          syncEntry(entry);
        };
        reader.readAsDataURL(file);
      });

      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        note.classList.remove('visible');
      });

      bar.addEventListener('mousedown', (e) => {
        if (e.target.closest('.hotspot-tool-btn')) return;
        e.stopPropagation();
        const startX = e.clientX;
        const startY = e.clientY;
        const startLeft = parseFloat(note.style.left);
        const startTop = parseFloat(note.style.top);

        function onMove(ev) {
          const nextLeft = Math.max(0, startLeft + (ev.clientX - startX));
          const nextTop = Math.max(0, startTop + (ev.clientY - startY));
          note.style.left = `${nextLeft}px`;
          note.style.top = `${nextTop}px`;
          item.windowLeft = nextLeft;
          item.windowTop = nextTop;
          updateHotspotRecord();
        }

        function onUp() {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        }

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      });

      renderBlocks();

      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        overlay.querySelectorAll('.hotspot-note.visible').forEach(el => {
          if (el !== note) el.classList.remove('visible');
        });
        note.classList.toggle('visible');
      });

      dot.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        const updated = prompt('Rename hotspot label number:', item.label);
        if (updated === null) return;
        item.label = updated.trim() || item.label;
        dot.textContent = item.label;
        dot.appendChild(note);
        title.textContent = `Hotspot ${item.label}`;
        updateHotspotRecord();
      });

      dot.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!confirm('Delete this hotspot?')) return;
        const all = getCurrentHotspots().filter(h => h.id !== item.id);
        setCurrentHotspots(all);
        dot.remove();
      });

      overlay.appendChild(dot);
    }

    function renderHotspotsForPage(pageNumber, overlay) {
      const hotspots = getCurrentHotspots().filter(item => item.page === pageNumber);
      hotspots.forEach(item => createHotspotElement(item, overlay));
    }

    function attachOverlayInteractions(overlay, pageNumber) {
      overlay.addEventListener('click', (e) => {
        overlay.querySelectorAll('.hotspot-note.visible').forEach(el => el.classList.remove('visible'));
        if (!hotspotMode) return;
        if (e.target.closest('.hotspot')) return;

        const rect = overlay.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        const text = '';

        hotspotCounter += 1;
        const item = {
          id: crypto.randomUUID(),
          page: pageNumber,
          x: +x.toFixed(3),
          y: +y.toFixed(3),
          text: text.trim() || '(empty)',
          label: hotspotCounter,
          windowLeft: 22,
          windowTop: 22,
          blocks: [
            {
              id: crypto.randomUUID(),
              type: 'text',
              x: 16,
              y: 16,
              w: 180,
              h: 90,
              text: text.trim() || '(empty)'
            }
          ]
        };

        const all = getCurrentHotspots();
        all.push(item);
        setCurrentHotspots(all);
        createHotspotElement(item, overlay);
      });
    }

    async function renderPdfFromUrl(url, label = 'Remote PDF') {
      viewer.innerHTML = '';
      try {
        const pdf = await pdfjsLib.getDocument(url).promise;
        currentDocKey = makeDocKey(label, url);
        const existing = getCurrentHotspots();
        hotspotCounter = existing.reduce((max, item) => Math.max(max, Number(item.label) || 0), 0);

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.35 });

          const pageWrap = document.createElement('div');
          pageWrap.className = 'page';
          pageWrap.style.width = `${viewport.width}px`;
          pageWrap.style.height = `${viewport.height}px`;

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          const ratio = window.devicePixelRatio || 1;

          canvas.width = Math.floor(viewport.width * ratio);
          canvas.height = Math.floor(viewport.height * ratio);
          canvas.style.width = `${viewport.width}px`;
          canvas.style.height = `${viewport.height}px`;
          context.setTransform(ratio, 0, 0, ratio, 0, 0);

          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          if (hotspotMode) overlay.classList.add('hotspot-mode');

          pageWrap.appendChild(canvas);
          pageWrap.appendChild(overlay);
          viewer.appendChild(pageWrap);

          await page.render({ canvasContext: context, viewport }).promise;
          attachOverlayInteractions(overlay, pageNum);
          renderHotspotsForPage(pageNum, overlay);
        }
        hideStatus();
      } catch (error) {
        console.error(error);
        viewer.innerHTML = '';
        showStatus(`Could not render ${label}.`);
      }
    }

    async function renderPdfData(data, label = 'Local PDF') {
      viewer.innerHTML = '';
      try {
        const pdf = await pdfjsLib.getDocument({ data }).promise;
        currentDocKey = makeDocKey(label, data.byteLength || 0);
        const existing = getCurrentHotspots();
        hotspotCounter = existing.reduce((max, item) => Math.max(max, Number(item.label) || 0), 0);

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.35 });

          const pageWrap = document.createElement('div');
          pageWrap.className = 'page';
          pageWrap.style.width = `${viewport.width}px`;
          pageWrap.style.height = `${viewport.height}px`;

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          const ratio = window.devicePixelRatio || 1;

          canvas.width = Math.floor(viewport.width * ratio);
          canvas.height = Math.floor(viewport.height * ratio);
          canvas.style.width = `${viewport.width}px`;
          canvas.style.height = `${viewport.height}px`;
          context.setTransform(ratio, 0, 0, ratio, 0, 0);

          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          if (hotspotMode) overlay.classList.add('hotspot-mode');

          pageWrap.appendChild(canvas);
          pageWrap.appendChild(overlay);
          viewer.appendChild(pageWrap);

          await page.render({
            canvasContext: context,
            viewport
          }).promise;

          attachOverlayInteractions(overlay, pageNum);
          renderHotspotsForPage(pageNum, overlay);
        }
        hideStatus();
      } catch (error) {
        console.error(error);
        viewer.innerHTML = '';
        showStatus(`Could not render ${label}.`);
      }
    }

    toggleUrlPanel.addEventListener('click', () => {
      const hidden = urlPanel.classList.toggle('hidden');
      toggleUrlPanel.textContent = hidden ? '＋' : '×';
    });

    loadUrlBtn.addEventListener('click', async () => {
      const url = (pdfUrlInput.value || '').trim();
      if (!url) return;
      setQueryPdfUrl(url);
      await renderPdfFromUrl(url, 'Remote PDF');
      urlPanel.classList.add('hidden');
      toggleUrlPanel.textContent = '＋';
      showStatus('Loaded PDF from URL.');
      setTimeout(hideStatus, 1600);
    });

    pdfUrlInput.addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter') return;
      loadUrlBtn.click();
    });

    uploadBtn.addEventListener('click', () => {
      fileInput.value = '';
      fileInput.click();
    });

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const buffer = await file.arrayBuffer();
      setQueryPdfUrl('');
      await renderPdfData(buffer, file.name);
      showStatus(`Loaded ${file.name}.`);
      setTimeout(hideStatus, 1800);
    });

    toggleNotepad.addEventListener('click', () => {
      togglePanel(notepadPanel, toggleNotepad, '✎');
    });

    toggleHotspots.addEventListener('click', () => {
      hotspotMode = !hotspotMode;
      toggleHotspots.classList.toggle('active', hotspotMode);
      document.querySelectorAll('.overlay').forEach(overlay => {
        overlay.classList.toggle('hotspot-mode', hotspotMode);
      });
      showStatus(hotspotMode ? 'Hotspot mode on. Click the PDF to place a note.' : 'Hotspot mode off.');
      setTimeout(hideStatus, 1600);
    });

    saveSessionBtn.addEventListener('click', async () => {
      const url = generateSessionURL();
      await navigator.clipboard.writeText(url);
      showStatus('Session saved and URL copied.');
      setTimeout(hideStatus, 1600);
    });

    embedBtn.addEventListener('click', () => {
      togglePanel(embedPanel, embedBtn, '⧉');
      if (!embedPanel.classList.contains('hidden')) {
        embedCode.value = generateEmbedUrl();
      }
    });

    copyEmbedBtn.addEventListener('click', async () => {
      await navigator.clipboard.writeText(embedCode.value);
      showStatus('Embed URL copied.');
      setTimeout(hideStatus, 1400);
    });

    loadSessionFromURL();
    notepad.value = loadSavedNotes();
    notepad.addEventListener('input', () => {
      saveNotes(notepad.value);
    });

    clearNotesBtn.addEventListener('click', () => {
      notepad.value = '';
      saveNotes('');
    });

    const initialPdfUrl = getQueryPdfUrl();
    if (initialPdfUrl) {
      pdfUrlInput.value = initialPdfUrl;
      renderPdfFromUrl(initialPdfUrl, 'Remote PDF');
    }
  </script>
</body>
</html>
